<html>
    <body>
        <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Gelasio:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
            <link href="style.css" rel="stylesheet" type="text/css" />
            </head>
            <style>
            /* CSS */

                .email {
                    padding: 30px;
                    border-radius: 10px;
                    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
                    max-width: 400px;
                    margin: 50px auto;
                    text-align: center;
                }

                .email h3 {
                    font-size: 24px;
                    color: #006d77;
                    margin-bottom: 10px;
                }

                .email h4 {
                    font-size: 18px;
                    color: #333;
                    font-weight: 600;
                    margin-top: 0;
                }


                @media (max-width: 768px) {
                    .email {
                        padding: 20px;
                        margin: 20px auto;
                        max-width: 90%;
                }

                .email h3 {
                    font-size: 20px;
                }

                .email h4 {
                    font-size: 20px;
                }
                }

                @media (max-width: 480px) {
                    .email {
                        padding: 15px;
                        margin: 10px auto;
                        max-width: 95%;
                }

                .email h3 {
                    font-size: 18px;
                }

                .email h4 {
                    font-size: 20px;
                }
            }

            </style>

            <div class="email">
            <h3>Do you have any questions or concerns?</h3>
            <h4>Feel free to contact me anytime and I'll respond as soon as possible.</h4>
            <h4>shahobidinovajasmina6@gmail.com</h4>
        </div>
    </body>
</html>
